import it.crystalnest.cobweb.gradle.UnsealHolder

plugins {
  id "multiloader-common"
  id "net.neoforged.moddev"
}

neoForge {
  neoFormVersion = neo_form_version
  def at = file("src/main/resources/META-INF/accesstransformer.cfg")
  if (at.exists()) {
    accessTransformers.from(at.absolutePath)
  }
}

def minecraftArtifacts = tasks.named("createMinecraftArtifacts")
def minecraftJarFiles = files(
  minecraftArtifacts.flatMap { it.gameJarArtifact },
  minecraftArtifacts.flatMap { it.gameJarWithSourcesArtifact.orElse(it.gameJarArtifact) }
)

def unsealHolder = tasks.register("unsealHolder", UnsealHolder) {
  group = "build setup"
  description = "Unseals vanilla Holder for common compilation without adding loader APIs"
  inputJar.set(minecraftArtifacts.flatMap { it.gameJarWithSourcesArtifact.orElse(it.gameJarArtifact) })
  outputJar.set(layout.buildDirectory.file("moddev/unsealed/minecraft.jar"))
}

// ModDevGradle supplies Minecraft as a file dependency on this development-only configuration.
// Replace that dependency (including IntelliJ's combined jar), preserving the game libraries.
configurations.named("modDevCompileDependencies") {
  def minecraftDependencies = dependencies.toList().findAll { it instanceof FileCollectionDependency && it.files.files.size() == 1 && minecraftJarFiles.files.containsAll(it.files.files) }
  if (minecraftDependencies.size() != 1) {
    throw new GradleException("Expected one Minecraft compile dependency; check ModDevGradle's configuration")
  }
  dependencies.removeAll(minecraftDependencies)
  dependencies.add(project.dependencies.create(project.files(unsealHolder.flatMap { it.outputJar })))
}

tasks.named("neoForgeIdeSync") {
  dependsOn(unsealHolder)
}

dependencies {
  compileOnly "org.spongepowered:mixin:0.8.7"
  compileOnly "io.github.llamalad7:mixinextras-common:0.5.3"
  annotationProcessor "io.github.llamalad7:mixinextras-common:0.5.3"
  compileOnly "fuzs.forgeconfigapiport:forgeconfigapiport-common-neoforgeapi:$fcap_version"
}

configurations {
  commonJava {
    canBeResolved = false
    canBeConsumed = true
  }
  commonResources {
    canBeResolved = false
    canBeConsumed = true
  }
}

artifacts {
  commonJava sourceSets.main.java.sourceDirectories.singleFile
  commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

def loaderAttribute = Attribute.of("io.github.mcgradleconventions.loader", String)
["apiElements", "runtimeElements", "sourcesElements", "javadocElements"].each { variant ->
  configurations.named("$variant") {
    attributes {
      attribute(loaderAttribute, "common")
    }
  }
}
sourceSets.configureEach {
  [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
    configurations.named("$variant") {
      attributes {
        attribute(loaderAttribute, "common")
      }
    }
  }
}

// Disable publishing tasks where common is not published
tasks.named("publishModrinth").get().setEnabled(false)
tasks.named("publishCurseforge").get().setEnabled(false)
tasks.named("publishGitHub").get().setEnabled(false)
